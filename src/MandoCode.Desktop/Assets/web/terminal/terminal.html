<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b12; overflow: hidden; }
    #host { position: absolute; inset: 0; }
    /* One container per shell tab; only the active one is displayed (multiplexing). */
    .term { position: absolute; inset: 0; padding: 6px 4px 4px 8px; box-sizing: border-box; }
    .xterm { height: 100%; }
    .xterm-viewport::-webkit-scrollbar { width: 10px; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 6px; }
  </style>
</head>
<body>
  <div id="host"></div>
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
